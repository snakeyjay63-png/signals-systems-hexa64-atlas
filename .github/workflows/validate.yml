name: validate-atlas
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python tools/analyze_quran_abjad.py --allow-missing
      - run: python tools/rebuild_atlas.py
      - run: python tools/validate_atlas.py
      - run: python -m unittest discover -s tests -v
      - name: Assert deterministic generated outputs
        run: git diff --exit-code -- assets/ verification.txt data/ validators/
